# SI units. Deck height/profile confirmed by user on 2026-09-15; other unmeasured values remain estimates.
# World ground is base_footprint z=0; upstream base_link is at z=0.087 m.
base_ground_offset: 0.087
frame_length: 0.60
frame_width: 0.50
frame_bottom_ground: 0.19
frame_top_ground: 0.701  # + 0.004 m deck = 0.705 m; arm mount excluded
profile_size: 0.03  # user-confirmed 30 x 30 mm
profile_linear_mass: 0.75  # kg/m, approximate extrusion with fittings excluded
plate_thickness: 0.004
plate_mass: 2.4
# Arm/box/central-camera XY and yaw retain their assembly-local front-layout values.
# Xacro maps them to the RIGHT side: (x,y,z) -> (y,(frame_length-frame_width)/2-x,z), yaw -= pi/2.
arm_mount_x: 0.235
arm_spacing: 0.38
arm_mount_length: 0.155
arm_mount_width: 0.134
arm_mount_thickness: 0.008
arm_mount_mass: 0.174633
# Assembly-coordinate mesh, recessed SO101 seat and existing four M5 hole axes.
arm_mount_mesh: mounts/so101_pinky_M5_mount_plate.stl
arm_1_yaw: 0.0
arm_2_yaw: 0.0
# Box local rear face touches the upper RIGHT profile after mapping; rim at profile top.
box_center_x: 0.40
box_center_y: 0.0
box_bottom_ground: 0.501  # rim 0.701 m
box_length: 0.20
box_width: 0.20
box_height: 0.20
box_wall: 0.005
box_empty_mass: 0.70
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      # Each bottom half slides outward by box_width/2 + clearance (m).
box_bottom_slide_clearance: 0.005
# Initial simulation limits, not measured actuator specifications (N, m/s).
box_bottom_slide_effort: 20.0
box_bottom_slide_velocity: 0.05

# D435 geometry: housing center frame (+x forward, +y left, +z up).
# Nominal size from RealSense ROS D435 description; mass/inertia are estimates.
d435_size: [0.02505, 0.090, 0.025]
d435_mass: 0.075
wrist_cameras_enabled: true
# User's SO100 print: large hole coaxial with SO101 holder outer -X hole.
# STL-derived alignment: d435_wrist_hole_alignment.json (2026-10-12).
# Inner plate contacts holder; screw fit/print tolerance/hand-eye remain unmeasured.
wrist_mount_xyz: [0.027089307412, 0.023085774722, -0.026124522750]
wrist_mount_rpy: [-0.002808981376, -1.533410790910, 0.002846361158]
wrist_mount_mass: 0.018
wrist_camera_xyz: [-0.004182305, 0.026180770, 0.026963399]
wrist_camera_rpy: [1.575992394, 0.035504780, -2.706613325]

# Height is deck TOP -> camera BODY CENTER. Moved backward 0.35 m and up 0.39 m.
overhead_camera_enabled: true
overhead_camera_height_above_deck: 0.49
overhead_camera_x: -0.115  # assembly-local 0.235 - 0.350; world y=+0.165
overhead_camera_y: 0.0
overhead_camera_rpy: [0.0, 0.5235987755982988, 0.0]  # pitch +30 deg looks down
# Rear support: mast 45 mm behind body center, tilted back plate, no front cradle.
overhead_base_thickness: 0.006
overhead_base_mass: 0.10  # estimated, not measured
overhead_bracket_thickness: 0.006
overhead_mast_rear_offset: 0.045
overhead_neck_height: 0.008
