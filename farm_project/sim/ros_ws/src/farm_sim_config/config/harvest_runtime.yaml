schema_version: 1
configured: true
mode: sim
robot_id: harvest_01
map_id: farm_map_v1
map_yaml: sim/ros_ws/src/farm_sim_config/maps/count_test_farm_map.yaml
route_graph: sim/ros_ws/src/farm_sim_config/maps/harvest_graph.geojson
nav_params: sim/ros_ws/src/farm_sim_config/config/nav2_harvest.yaml
device_config: sim/ros_ws/src/farm_sim_config/config/harvest.json
navigation_policy: robot/config/navigation/harvest_navigation.yaml
navigation:
  map_frame: map
  base_frame: harvest_01/base_footprint
harvest_config: sim/ros_ws/src/farm_sim_config/config/harvest_task.json
tag_localization_config: sim/ros_ws/src/farm_sim_config/config/tag_localization/harvest.yaml
rviz_config: sim/ros_ws/src/farm_sim_config/config/harvest.rviz
station_config: sim/ros_ws/src/farm_sim_config/config/station_spawn.json

# 실물 cf4023b 복귀 컴포넌트. 시뮬 지도와 기존 전진/후진 선택을 유지한다.
station_return_components: true
station_return_navigation:
  arrival_tolerance_m: 0.05
  heading_tolerance_rad: 0.10471975511965978
  # 인계 출력 소유자가 없는 단독 실행은 재시도하지 않는다.
  collision_retry_count: 0
