geometry_policy:
  type: conservative_axis_aligned_envelope
  bounds_order: [xmin, ymin, xmax, ymax]
  closed_boundary: true
  padding_radius_m: 0.460978
  source: max_padded_body_circumradius_rounded_up_1um
  shared_id_geometry: union_bounds_preserve_source_coordinates
  geometry_is_drivable_area: false
  margin_already_included: true
  reservation_conflicts: same_zone_or_direct_intersecting_envelopes
  occupancy: rotated_padded_actual_body_intersects_envelope
  partial_edge_occupancy: block_entire_undirected_edge
  overlap_transitive_closure: false
waiting_policy:
  candidates: all_registered_graph_nodes
  capacity_per_physical_node: 1
  selection: previous_route_node_before_blocked_resource_then_search_backwards
  require_static_map_clearance: true
  require_route_and_stop_space_grant_before_motion: true
  include_overlapping_edges: true
  assume_all_candidates_safe: false
  turning: must_fit_padded_body_sweep_in_free_map_space
time_policy:
  permit_ttl_enabled: false
  renew_enabled: false
  progress_period_sim_s: 1.0
  on_state_change: immediate
  clock_backward: full_reset
