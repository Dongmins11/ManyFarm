# 공통 Nav2 기본값과 장치 연결. 필요한 파라미터 변경은 overrides에 명시한다.
shared_nav2: robot/config/navigation/harvest_nav2.yaml
bindings:
  base_footprint_frame: harvest_01/base_footprint
  base_link_frame: harvest_01/base_link
  odom_frame: harvest_01/odom
  scan_topic: scan
  set_initial_pose: true
  initial_pose:
    x: -2.0
    y: 13.25
    z: 0.0
    yaw: -1.5707963267948966
# 시뮬 회전 시 병진 불확실성: 동일 센서 재생으로 검증, 실물 기본값 0.2 유지.
overrides:
  # 2026-10-30 실물 수치 정합: RPP 속도는 공통 0.1을 상속하고 일반 Spin도 실물과 맞춘다.
  behavior_server:
    ros__parameters:
      min_rotational_vel: 0.1
      max_rotational_vel: 0.1
      rotational_acc_lim: 1.0
  amcl:
    ros__parameters:
      alpha4: 0.002
  # 5Hz(/clock) 발행은 느린 프레임에서 실제 수신 간격 0.5초를 넘는다.
  # 팔 카메라 동작 중 측정: 10Hz 발행도 최대0.70초, 20Hz는 최대0.40초.
  # 계산 주기10Hz는 유지하며 발행의 ROS 시간 대기만 줄인다. 만료 판정 유지.
  local_costmap:
    local_costmap:
      ros__parameters:
        publish_frequency: 20.0
