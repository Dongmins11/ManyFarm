amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: harvest_01/base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: harvest_01/odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    map_topic: /harvest_01/map
    scan_topic: /harvest_01/scan
    set_initial_pose: true
    initial_pose:
      x: -2.0
      y: 13.25
      z: 0.0
      yaw: -1.5707963267948966
    use_sim_time: true
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: harvest_01/base_footprint
    odom_topic: /harvest_01/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
    enable_stamped_cmd_vel: false
    use_sim_time: true
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - RPP
    use_realtime_priority: false
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 30.0
    enable_stamped_cmd_vel: false
    odom_topic: /harvest_01/odom
    use_sim_time: true
    RPP:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.12
      lookahead_dist: 0.35
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.6
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.04
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.4
      max_angular_accel: 10.0
      cost_scaling_dist: 0.2
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 4.0
    goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.015
      yaw_goal_tolerance: 0.04
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: harvest_01/odom
      robot_base_frame: harvest_01/base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.45
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /harvest_01/map
      always_send_full_costmap: true
      transform_tolerance: 0.3
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /harvest_01/scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: true
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
          obstacle_max_range: 7.5
          obstacle_min_range: 0.12
          max_obstacle_height: 2.0
      use_sim_time: true
      footprint: '[[0.35, -0.30], [0.35, 0.30], [-0.35, 0.30], [-0.35, -0.30]]'
      footprint_padding: 0.01
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: harvest_01/base_footprint
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /harvest_01/scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: true
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
          obstacle_max_range: 7.5
          obstacle_min_range: 0.12
          max_obstacle_height: 2.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /harvest_01/map
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.45
      always_send_full_costmap: true
      transform_tolerance: 0.3
      use_sim_time: true
      footprint: '[[0.35, -0.30], [0.35, 0.30], [-0.35, 0.30], [-0.35, -0.30]]'
      footprint_padding: 0.01
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins:
    - GridBased
    costmap_update_timeout: 1.0
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.1
      use_astar: false
      allow_unknown: false
    use_sim_time: true
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: harvest_01/odom
    global_frame: map
    robot_base_frame: harvest_01/base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0
    enable_stamped_cmd_vel: false
    use_sim_time: true
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.12
    - 0.0
    - 0.6
    min_velocity:
    - -0.08
    - 0.0
    - -0.6
    max_accel:
    - 0.25
    - 0.0
    - 1.0
    max_decel:
    - -0.4
    - 0.0
    - -1.2
    odom_topic: /harvest_01/odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.4
    enable_stamped_cmd_vel: false
    use_sim_time: true
map_server:
  ros__parameters:
    frame_id: map
    topic_name: map
    use_sim_time: true
