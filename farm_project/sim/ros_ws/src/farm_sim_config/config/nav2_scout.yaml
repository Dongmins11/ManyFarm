# 공통 Nav2 기본값과 장치 연결. 필요한 파라미터 변경은 overrides에 명시한다.
shared_nav2: robot/config/navigation/scout_nav2.yaml
bindings:
  base_footprint_frame: scout_01/base_footprint
  base_link_frame: scout_01/base_link
  odom_frame: scout_01/odom
  scan_topic: scan
  set_initial_pose: true
  initial_pose:
    x: -5.0
    y: 13.25
    z: 0.0
    yaw: -1.5707963267948966
