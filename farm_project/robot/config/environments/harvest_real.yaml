# 예찰과 동일한 300cm 지도·전체 그래프. 14번까지 실물 검증은 별도.
schema_version: 1
configured: true
mode: real
robot_id: harvest_01
map_id: many_farm_v1
map_yaml: robot/config/maps/many_farm/many_farm.yaml
route_graph: robot/config/maps/many_farm/graph.geojson
nav_params: robot/config/robots/vicpinky/nav2.yaml
device_config: robot/config/robots/vicpinky/devices.json
harvest_config: robot/config/harvest/harvest_real.json
