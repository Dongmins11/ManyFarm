# 공통 Nav2 기본값과 장치 연결. 필요한 파라미터 변경은 overrides에 명시한다.
shared_nav2: robot/config/navigation/scout_nav2.yaml
bindings:
  base_footprint_frame: base_footprint
  base_link_frame: base_link
  odom_frame: odom
  scan_topic: scan
  set_initial_pose: false
  initial_pose:
    x: -0.244
    y: 0.364
    z: 0.0
    yaw: -1.5707963267948966

overrides:
  amcl:
    ros__parameters:
      # 실물 예찰: 짧은 이동·미세 회전에서도 지도 기반 위치 보정을 갱신한다.
      update_min_d: 0.05
      update_min_a: 0.05
  behavior_server:
    ros__parameters:
      max_rotational_vel: 0.3
      min_rotational_vel: 0.08
      rotational_acc_lim: 0.5
  controller_server:
    ros__parameters:
      RPP:
        approach_velocity_scaling_dist: 0.3
        min_approach_linear_velocity: 0.04
        lookahead_dist: 0.12
      goal_checker_plugins: [goal_checker, station_goal_checker]
      goal_checker:
        xy_goal_tolerance: 0.01
      station_goal_checker:
        plugin: nav2_controller::SimpleGoalChecker
        stateful: false
        xy_goal_tolerance: 0.01
        yaw_goal_tolerance: 0.05235987755982989
