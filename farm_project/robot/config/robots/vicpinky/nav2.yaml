# 공통 Nav2 기본값과 장치 연결. 필요한 파라미터 변경은 overrides에 명시한다.
shared_nav2: robot/config/navigation/harvest_nav2.yaml
bindings:
  base_footprint_frame: base_footprint
  base_link_frame: base_link
  odom_frame: odom
  scan_topic: scan_filtered
  set_initial_pose: false
  initial_pose:
    x: 0.608
    y: 0.357
    z: 0.0
    yaw: -1.5707963267948966
overrides:
  # 실물 launch의 절대 토픽 remap을 사용해 costmap 하위 namespace를 피한다.
  local_costmap:
    local_costmap:
      ros__parameters:
        voxel_layer:
          scan:
            topic: /scan_filtered
  global_costmap:
    global_costmap:
      ros__parameters:
        obstacle_layer:
          scan:
            topic: /scan_filtered
