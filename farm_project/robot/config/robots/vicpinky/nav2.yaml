# 공통 주행 구현·정책을 사용하고 10/14 실물 검증 설정만 덮어쓴다.
shared_nav2: robot/config/navigation/harvest_nav2.yaml
bindings:
  base_footprint_frame: base_footprint
  base_link_frame: base_link
  odom_frame: odom
  scan_topic: scan_filtered
  set_initial_pose: false
  initial_pose:
    x: 0.608
    y: 0.357
    z: 0.0
    yaw: -1.5707963267948966
overrides:
  controller_server:
    ros__parameters:
      HarvestApproach:
        lookahead_dist: 0.1
        curvature_lookahead_dist: 0.1
  local_costmap:
    local_costmap:
      ros__parameters:
        resolution: 0.025
        footprint: '[[0.30, -0.25], [0.30, 0.25], [-0.30, 0.25], [-0.30, -0.25]]'
        footprint_padding: 0.02
  global_costmap:
    global_costmap:
      ros__parameters:
        footprint: '[[0.30, -0.25], [0.30, 0.25], [-0.30, 0.25], [-0.30, -0.25]]'
        footprint_padding: 0.02
