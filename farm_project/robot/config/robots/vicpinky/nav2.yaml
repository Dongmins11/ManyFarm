# 공통 주행 구현·정책을 사용하고 10/14 실물 검증 설정만 덮어쓴다.
shared_nav2: robot/config/navigation/harvest_nav2.yaml
bindings:
  base_footprint_frame: base_footprint
  base_link_frame: base_link
  odom_frame: odom
  scan_topic: scan_filtered
  set_initial_pose: false
  initial_pose:
    x: 0.608
    y: 0.357
    z: 0.0
    yaw: -1.5707963267948966
overrides:
  behavior_server:
    ros__parameters:
      # 차체 단독 Spin 시험 후보. 주행 controller 설정과 별도로 적용한다.
      min_rotational_vel: 0.1
      max_rotational_vel: 0.1
      rotational_acc_lim: 1.0
  controller_server:
    ros__parameters:
      HarvestApproach:
        lookahead_dist: 0.1
        curvature_lookahead_dist: 0.1
  local_costmap:
    local_costmap:
      ros__parameters:
        resolution: 0.02
        footprint: '[[0.30, -0.25], [0.30, 0.25], [-0.30, 0.25], [-0.30, -0.25]]'
        footprint_padding: 0.02
        # 기존 실물 launch의 절대 토픽 remap을 사용해 costmap 하위 namespace를 피한다.
        voxel_layer:
          scan:
            topic: /scan_filtered
  global_costmap:
    global_costmap:
      ros__parameters:
        footprint: '[[0.30, -0.25], [0.30, 0.25], [-0.30, 0.25], [-0.30, -0.25]]'
        footprint_padding: 0.02
        obstacle_layer:
          scan:
            topic: /scan_filtered
