# 운송로봇 기구 브리지 설정. 바꾼 뒤에는 colcon build 다시 (또는 --symlink-install)
/**:
  ros__parameters:
    robot_ns: transport_01      # 서비스 앞부분 → /transport_01/device/...
    port: /dev/ttyS0            # 라즈베리파이 UART (OpenCR Serial1)
    baud: 115200
    lid_timeout: 10.0           # 덮개 열기·닫기 제한 시간 [초] (실제 약 4.0초)
    gate_timeout: 5.0           # 앞문 [초] (실제 약 1.2초)
    dump_timeout: 30.0          # 틸트 쏟기 [초] (실제 약 20초)
    stop_timeout: 1.0
    ping_timeout: 1.0
